name: Compiler S.C.P

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Décompresser le projet
        run: |
          unzip -o SCP.zip -d extrait
          d=$(dirname "$(find extrait -name settings.gradle.kts | head -1)")
          echo "Projet trouvé dans : $d"
          mv "$d" projet

      - name: Ajouter les musiques
        run: python3 projet/outils/musique.py musique projet/app/src/main/assets/musique

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l'APK
        working-directory: projet
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp projet/app/build/outputs/apk/release/app-release.apk S.C.P-Android-1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: S.C.P-Android-*.apk

  pc:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Décompresser le projet
        run: |
          Expand-Archive -Path SCP.zip -DestinationPath extrait -Force
          $d = (Get-ChildItem extrait -Recurse -Filter settings.gradle.kts | Select-Object -First 1).DirectoryName
          Write-Host "Projet trouvé dans : $d"
          Move-Item $d projet

      - name: Ajouter les musiques
        run: python projet/outils/musique.py musique projet/app/src/main/assets/musique

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Copier le site et les musiques dans l'app PC
        run: Copy-Item -Path projet/app/src/main/assets/* -Destination projet/desktop -Recurse -Force

      - name: Compiler le .exe
        working-directory: projet/desktop
        run: |
          npm install
          npm pkg set version=1.${{ github.run_number }}.0
          npx electron-builder --win portable --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: pc
          path: projet/desktop/dist/*.exe

  publier:
    needs: [ android, pc ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sortie
          merge-multiple: true

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: S.C.P v1.${{ github.run_number }}
          body: |
            Téléphone Android : téléchargez le fichier .apk et installez-le.
            PC Windows : téléchargez le fichier .exe et lancez-le (aucune installation).
          files: sortie/*
          make_latest: true
